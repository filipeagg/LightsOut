# Builtin template (TP-02, DESIGN §16.3). One human gate, on the plan, because that is where a
# wrong turn is cheapest to fix and everything after it is executed faithfully.
#
# The separate `shape-the-prompt` phase is gone (BA-01, 2026-07-27): asking one agent to turn the
# request into a specification and another to turn the specification into a plan produced 36 kB of
# PROMPT.md for a single page, and the second agent read the first agent's prose rather than the
# code. The planner does both, from the brief and the request, in one pass.
id: full-development
name: Full development
description: >
  End-to-end delivery of a feature or a system, from a rough idea to audited and
  tested code. Use it when the result has to be maintainable.
when_to_use: >
  The result is code someone will maintain, the work is more than an afternoon,
  and being right matters more than being quick. Also whenever you want a person
  to approve the plan before anything is built.
not_for: >
  Proving an idea (quick-prototype), answering a question (quick-answers), or
  code that arrived as an archive and is not understood yet (legacy-intake).
phases:
  - id: probe-contracts
    title: Probe the external contracts
    agent: contract-prober
    optional: true
    repeatable: true
    deliverable: doc/CONTRACTS.md
    instructions: |
      For every API or integration the brief depends on, write real probes under probes/
      against the test credentials in the vault and record what actually happens in
      doc/CONTRACTS.md: status codes, pagination, rate limits, auth behaviour and error
      shapes, with real examples. Mark as unverified anything you could not call. Raise
      a doubt when an entry you need is missing from the vault.
  - id: plan
    title: Understand the request and write the plan
    agent: planner
    gate: human
    deliverable: doc/PLAN.md
    instructions: |
      Two jobs in one pass, and the order matters: first work out what is actually being
      asked, then write the plan for it.

      Read the project brief and this launch's request, doc/CONTRACTS.md when it exists,
      and the code that already exists. The brief is the standing truth; the request is
      what changes this time.

      Then produce doc/PLAN.md. Open it with what you understood — scope, non-goals,
      actors, the acceptance criteria in checkable terms — in no more than twenty lines,
      because a specification longer than the plan it introduces is a specification
      nobody will read. Then the ordered tasks: what each changes, which files, the
      interface, the edge cases, how it is verified, what it depends on.

      Every risk you see goes in, in plain words, unsoftened. Anything you cannot decide
      alone is a doubt, not a guess and not a paragraph hedging both ways.
  - id: build
    title: Implement the plan
    agent: builder
    repeatable: true
    verify: npm test
    instructions: |
      Implement the next unfinished task of doc/PLAN.md, and only that task. Keep the
      tests that cover the behaviour you change up to date. Tick the task in
      doc/PLAN.md when it is done. Stop and raise a doubt if the task is ambiguous or
      contradicts the code.
  - id: qa
    title: Regression and integration tests
    agent: qa-engineer
    deliverable: doc/QA-REPORT.md
    instructions: |
      Cover the acceptance criteria of doc/PROMPT.md and the edge cases of
      doc/PLAN.md. Run what you write. Report in doc/QA-REPORT.md what passed, what
      failed and the exact command to reproduce each failure. Do not fix the product.
  - id: audit
    title: Audit the delivered code
    agent: software-auditor
    deliverable: doc/AUDIT.md
    instructions: |
      Audit the delivered code against doc/PLAN.md. Report correctness defects,
      security and data-integrity risks, missing or misleading tests, and engineering
      practice, in that order, ranked by what each costs if ignored. Produce
      doc/AUDIT.md. Change nothing.
