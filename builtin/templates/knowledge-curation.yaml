# Builtin template (TP-02, KB-07, DESIGN §16.3). The only template that runs with a writable
# knowledge base attached (KB-05): create_project rejects it without writableKnowledge.
id: knowledge-curation
name: Knowledge curation
when_to_use: >
  The deliverable is understanding, not code: turning a system that exists into a
  knowledge base the next project reads. The only template that writes into a
  knowledge base, so it needs writableKnowledge (KB-05).
not_for: >
  Changing the system it studies. If the point is to modify the code, use
  legacy-intake, which does this analysis and then works on it.
description: >
  Turning an existing system into a curated knowledge base the next project can read.
requires_writable_knowledge: true
phases:
  - id: analyse
    title: Read the system until you understand it
    agent: codebase-analyst
    repeatable: true
    deliverable: doc/ANALYSIS.md
    instructions: |
      Read the system named in the task spec: code first, then schema, then
      configuration. Produce doc/ANALYSIS.md: what it does, how it is structured, its
      invariants, and where its complexity actually lives. Label every statement by what
      makes it true — constraint, invariant, preference or accident — and give it a
      source. Relaunch this phase per subsystem when one pass is not enough.

      Machine-first (protocol block, DESIGN §20): key: value and tables, one fact per
      line, no prose. A relaunch rewrites the document in place: raise meta.passes,
      supersede what changed, and never append a second account of the same subject. If
      you are blocked, meta.status and meta.blocked_on say so in two lines and you stop —
      a report about being blocked is not a deliverable.
  - id: interrogate
    title: Ask what the code cannot answer
    agent: codebase-analyst
    gate: human
    deliverable: doc/OPEN-QUESTIONS.md
    instructions: |
      List in doc/OPEN-QUESTIONS.md everything you could not determine from the source:
      business rules, intent, why a workaround exists, which behaviours are load-bearing.
      One question per id, machine-first: q.1.question, q.1.blocks, q.1.who_can_answer,
      q.1.status, q.1.answer. For each question you actually need answered in order to
      write the base, raise one functional doubt with concrete options. Do not put the
      questions in the gate: the gate only means a person has read the deliverable.
  - id: write-base
    title: Write the knowledge base
    agent: codebase-analyst
    deliverable: "workspace:knowledge/*/index.md"
    instructions: |
      Write the base into the directory the prompt names under "The knowledge base you
      write into". Use that absolute path: a relative knowledge/... would land inside this
      project and nobody would ever read it. Produce knowledge.yaml as the manifest (id,
      name, kind, description, tags, owner, updated), index.md as a table of contents with
      one line per document saying what is in it, and one Markdown document per coherent
      subject. Fold in the answers you received. Write for an agent that will read the
      index and then choose what to open: machine-first throughout, one fact per line with
      its source, no prose anywhere.
