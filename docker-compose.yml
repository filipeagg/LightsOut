services:
  lightsout:
    build: .
    image: lightsout:local
    container_name: lightsout
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LO_PORT:-8484}:8484"      # panel + API + /mcp (WP-09)
      - "127.0.0.1:1455:1455"                  # engine OAuth callback (SU-04, phase 8)
    volumes:
      # RT-02: a folder on the user's own machine, so projects are openable in their own editor.
      # Headless installs use the managed volume: add -f docker-compose.volume.yml.
      - ${LIGHTSOUT_WORKSPACE:-~/LightsOut}:/workspace
      - lightsout-db:/data                      # DB-01
      - claude-auth:/home/app/.claude           # RT-03
      - codex-auth:/home/app/.codex             # RT-03
      # - ${SSH_DIR:-~/.ssh}:/home/app/.ssh:ro  # optional, git push (PM-05)
    environment:
      - LO_BIND=0.0.0.0
      - LO_DB=/data/lightsout.db
      - LO_WORKSPACE=/workspace
      - LO_WORKSPACE_MODE=${LO_WORKSPACE_MODE:-host}
      # The same folder as the user sees it, so a document can be reported at a path they can
      # open in their own editor (PM-10). Empty when the workspace is a managed volume.
      - LO_WORKSPACE_HOST=${LIGHTSOUT_WORKSPACE:-}
      # Diagnostic only (OB-06): records the raw ACP tool notifications so a timeline that says
      # nothing useful can be diagnosed. Noisy; leave empty unless you are looking at something.
      - LO_DEBUG_ACP=${LO_DEBUG_ACP:-}
    env_file: .env

  # Egress allowlist proxy (RT-05). Enable with: docker compose --profile secure up -d
  egress:
    image: monokal/tinyproxy:latest
    container_name: lightsout-egress
    profiles: ["secure"]
    restart: unless-stopped
    command: ANY
    volumes:
      - ./proxy/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
    expose:
      - "8888"

# Explicit names: compose would otherwise prefix them with the project directory name, and
# scripts/windows/Start-LightsOut.ps1 (plain docker run) would mount different, empty volumes.
volumes:
  lightsout-db:
    name: lightsout-db
  claude-auth:
    name: claude-auth
  codex-auth:
    name: codex-auth
