/**
 * The phase editor (TP-04): one row per phase, with the agent and the gate as selects and the
 * flags as checkboxes. Add, remove and reorder act on `draft`, a panel-local copy of the array,
 * and nothing reaches the server until Save — so a half-finished reordering is not a half-written
 * template. The JSON view is still there behind a toggle for pasting a whole list in at once, but
 * it is a view of the same draft, not a second source.
 *
 * (This replaced the JSON-only textarea it used to be; see DECISIONS.md.)
 */
let draft = null;

/** A new template starts with one phase rather than none: an empty list cannot be saved (TP-01). */
const BLANK_PHASE = {
  id: "analyse",
  title: "",
  agent: "",
  instructions: "",
  gate: "auto",
  optional: false,
  repeatable: false,
};

function startDraft(tpl) {
  draft = tpl ? tpl.phases.map(cleanPhase) : [{ ...BLANK_PHASE }];
}

/**
 * Open the editor on a template, discarding any draft left from another one. `'new-template'`
 * opens it empty, which is how a template gets created (TP-04).
 */
function editPhases(id) {
  draft = null;
  editingJson = false;
  editing = id;
  paint();
}

function templateEditor(tpl) {
  if (draft === null) startDraft(tpl);
  const agents = store.agents
    ? store.agents.agents.filter((a) => a.valid && a.enabled !== false).map((a) => a.id)
    : [];
  const isNew = tpl === null;
  const meta = tpl ?? { id: "", name: "", description: "", requiresWritableKnowledge: false };
  return `<div style="margin-top:12px" class="${isNew ? "card pad" : ""}">
    ${isNew ? `<div class="micro" style="margin-bottom:8px">A new template</div>` : ""}
    <div class="row wrap" style="gap:16px;margin-bottom:12px">
      ${isNew
        ? `<label class="tiny">Id<br><input id="tpl-id" placeholder="api-integration"></label>`
        : `<label class="tiny">Id<br><input value="${esc(meta.id)}" readonly></label>`}
      <label class="tiny">Name<br><input id="tpl-name" value="${esc(meta.name || "")}"
        placeholder="API integration"></label>
      <label class="tiny" style="display:flex;align-items:flex-end;gap:6px;padding-bottom:8px">
        <input type="checkbox" id="tpl-writable" ${meta.requiresWritableKnowledge ? "checked" : ""}>
        needs a writable knowledge base</label>
    </div>
    <label class="tiny">Description<br><input id="tpl-description"
      value="${esc(meta.description || "")}" style="width:100%"></label>
    ${isNew ? `<p class="tiny muted" style="margin:8px 0 0">The id becomes the file name under
      <code>templates/</code>. Give the template an id matching a builtin and this becomes a
      workspace copy that shadows it (TP-04).</p>` : ""}
    <div class="between" style="margin:16px 0 8px">
      <span class="micro">Phases · ${draft.length}</span>
      <div class="row" style="gap:6px">
        <button class="btn sm" onclick="addDraftPhase()">+ Add a phase</button>
        <button class="btn sm" onclick="toggleJson()">
          ${editingJson ? "Back to the form" : "Edit as JSON"}</button>
      </div>
    </div>
    ${editingJson
      ? `<label class="tiny">The same list, for pasting one in whole<br>
          <textarea id="tpl-phases" rows="16" style="width:100%;font-family:var(--mono)">${esc(
            JSON.stringify(draft, null, 2),
          )}</textarea></label>
         <p class="tiny muted">Saving from here parses this text; switching back re-reads it into
           the form, so whichever one you edited last is the one that counts.</p>`
      : draft.map((p, i) => phaseRow(p, i, agents)).join("")}
    <div class="row" style="gap:8px;margin-top:12px">
      <button class="btn primary" onclick="saveTemplate(${isNew ? "null" : `'${esc(meta.id)}'`})">
        ${isNew ? "Create" : meta.source === "builtin" ? "Save as a workspace copy" : "Save"}</button>
      <button class="btn" onclick="cancelTemplate()">Cancel</button>
    </div>
  </div>`;
}

/** One phase. Every field writes straight into the draft, so a repaint never loses a keystroke. */
function phaseRow(p, i, agents) {
  const set = (key) => `onchange="setDraft(${i},'${key}',this.value)"`;
  const flag = (key) => `onchange="setDraft(${i},'${key}',this.checked)"`;
  const known = agents.includes(p.agent) ? agents : [p.agent, ...agents];
  return `<div class="card pad-sm" style="margin-bottom:8px;background:var(--surface-2)">
    <div class="between">
      <span class="micro">${i + 1}</span>
      <div class="row" style="gap:4px">
        <button class="btn sm" ${i === 0 ? "disabled" : ""} onclick="moveDraft(${i},-1)" title="Move up">↑</button>
        <button class="btn sm" ${i === draft.length - 1 ? "disabled" : ""} onclick="moveDraft(${i},1)" title="Move down">↓</button>
        <button class="btn sm danger" onclick="removeDraft(${i})">Remove</button>
      </div>
    </div>
    <div class="row wrap" style="gap:12px;margin-top:8px">
      <label class="tiny">Id<br><input value="${esc(p.id)}" ${set("id")} placeholder="shape-the-prompt"></label>
      <label class="tiny" style="flex:1;min-width:220px">Title<br>
        <input value="${esc(p.title)}" ${set("title")} placeholder="Turn the idea into a workable prompt"></label>
      <label class="tiny">Agent<br><select ${set("agent")}>${known
        .map((a) => `<option ${a === p.agent ? "selected" : ""}>${esc(a)}</option>`)
        .join("")}${agents.length === 0 ? `<option selected>${esc(p.agent)}</option>` : ""}</select></label>
      <label class="tiny">Gate<br><select ${set("gate")}>
        <option value="auto" ${(p.gate || "auto") === "auto" ? "selected" : ""}>auto</option>
        <option value="human" ${p.gate === "human" ? "selected" : ""}>human gate</option>
      </select></label>
    </div>
    <div class="row wrap" style="gap:12px;margin-top:8px">
      <label class="tiny" style="flex:1;min-width:200px">Deliverable<br>
        <input value="${esc(p.deliverable || "")}" ${set("deliverable")} placeholder="doc/PROMPT.md"></label>
      <label class="tiny" style="flex:1;min-width:200px">Verify command<br>
        <input value="${esc(p.verify || "")}" ${set("verify")} placeholder="npm test"></label>
      <label class="tiny" style="align-self:end">
        <input type="checkbox" ${p.optional ? "checked" : ""} ${flag("optional")}> optional</label>
      <label class="tiny" style="align-self:end">
        <input type="checkbox" ${p.repeatable ? "checked" : ""} ${flag("repeatable")}> repeatable</label>
    </div>
    <label class="tiny" style="display:block;margin-top:8px">Instructions<br>
      <textarea rows="4" ${set("instructions")}>${esc(p.instructions || "")}</textarea></label>
  </div>`;
}

/* The draft mutators. `paint()` is only called where the DOM has to change shape. */
function setDraft(i, key, value) {
  draft[i][key] = value;
}
function addDraftPhase() {
  if (editingJson) readJsonDraft();
  draft.push({ id: "", title: "", agent: draftDefaultAgent(), instructions: "" });
  paint();
}
function removeDraft(i) {
  if (editingJson) readJsonDraft();
  draft.splice(i, 1);
  paint();
}
function moveDraft(i, by) {
  const to = i + by;
  if (to < 0 || to >= draft.length) return;
  [draft[i], draft[to]] = [draft[to], draft[i]];
  paint();
}
function draftDefaultAgent() {
  const list = store.agents ? store.agents.agents.filter((a) => a.valid && a.enabled !== false) : [];
  return list.length ? list[0].id : "builder";
}
function cancelTemplate() {
  draft = null;
  editingJson = false;
  editing = null;
  paint();
}

/** Leaving the JSON view reads it back first, so switching is not a way to lose an edit. */
function toggleJson() {
  if (editingJson && !readJsonDraft()) return;
  editingJson = !editingJson;
  paint();
}

/** Pull the JSON view back into the draft, so the two never disagree about what is being saved. */
function readJsonDraft() {
  const node = $("tpl-phases");
  if (!node) return true;
  try {
    const parsed = JSON.parse(node.value);
    if (!Array.isArray(parsed)) throw new Error("the phase list must be an array");
    draft = parsed;
    return true;
  } catch (err) {
    store.error = `the phase list is not valid JSON: ${err.message}`;
    paint();
    return false;
  }
}

function cleanPhase(p) {
  const out = { id: p.id, title: p.title, agent: p.agent, instructions: p.instructions };
  if (p.deliverable) out.deliverable = p.deliverable;
  if (p.verify) out.verify = p.verify;
  if (p.gate && p.gate !== "auto") out.gate = p.gate;
  if (p.optional) out.optional = true;
  if (p.repeatable) out.repeatable = true;
  return out;
}

/**
 * Save a template, or create one when `id` is null (TP-04). The metadata travels with the phases:
 * before this, the panel could only rewrite the phase list, so a template's name and description
 * were editable nowhere and a new one could not be made at all.
 */
async function saveTemplate(id) {
  if (editingJson && !readJsonDraft()) return;
  const phases = draft.map(cleanPhase);
  const missing = phases.findIndex((p) => !p.id || !p.title || !p.agent || !p.instructions);
  if (missing !== -1) {
    store.error = `phase ${missing + 1} needs an id, a title, an agent and instructions`;
    return paint();
  }

  const newId = id === null ? field("tpl-id") : id;
  if (!newId) {
    store.error = "an id is required";
    return paint();
  }
  const patch = {
    phases,
    name: field("tpl-name") || newId,
    description: field("tpl-description"),
    requires_writable_knowledge: checked("tpl-writable"),
  };

  draft = null;
  editingJson = false;
  if (id === null) {
    return act("POST", "/api/templates", { id: newId, ...patch });
  }
  await act("PUT", `/api/templates/${encodeURIComponent(id)}`, patch);
}

async function deleteTemplate(id) {
  if (!confirmed(`the workspace template ${id}`)) return;
  await act("DELETE", `/api/templates/${encodeURIComponent(id)}`);
}

/* ---------- knowledge (KB-01..03) ---------- */

function viewKnowledge() {
  const k = store.knowledge;
  if (!k) return `<div class="empty">Loading…</div>`;
  return `<h1>Knowledge <em>${k.bases.length}</em></h1>
    <p class="sub">What an agent is told before it starts. Every document is injected labelled
      with its base and its kind, because a preference and a constraint are not the same
      thing (KB-02).</p>
    <div class="row" style="margin-bottom:16px">
      <button class="btn primary" onclick="editBase('new-base')">New base</button>
    </div>
    ${editing === "new-base" ? baseForm(null) : ""}
    ${k.bases
      .map(
        (b) => `<div class="card pad" style="margin-bottom:16px">
      <div class="row" style="justify-content:space-between">
        <div><b>${esc(b.name)}</b> <code class="tiny">${esc(b.id)}</code>
          <span class="pill">${esc(b.kind)}</span>
          ${b.enforcement === "hard" ? `<span class="pill red">hard rules</span>` : ""}
          ${b.source ? `<span class="pill blue">linked</span>` : ""}
          <div class="tiny muted">${esc(b.description || "")}</div>
          <div class="tiny muted">${b.documents.length} document(s)${
            b.updated ? ` · updated ${esc(b.updated)}` : ""}${
            b.source ? ` · read from <code>${esc(b.source)}</code>` : ""}</div></div>
        <div class="row" style="gap:6px">
          <button class="btn sm" onclick="editBase('base:${esc(b.id)}')">Edit</button>
          ${b.source
            ? ""
            : `<button class="btn sm" onclick="editing='doc:${esc(b.id)}';paint()">Add a document</button>`}
          <button class="btn sm danger" onclick="deleteBase('${esc(b.id)}')">Delete</button>
        </div>
      </div>
      ${documentList(b)}
      ${editing === `base:${b.id}` ? baseForm(b) : ""}
      ${editing === `doc:${b.id}` ? docForm(b) : ""}
    </div>`,
      )
      .join("")}`;
}

/**
 * The documents of a base. A linked base lists them without a delete button: the folder is the
 * source of truth and it belongs to whoever put it there (KB-08).
 */
function documentList(b) {
  if (b.documents.length === 0) {
    return `<div class="tiny muted" style="margin-top:8px">No documents yet.</div>`;
  }
  return `<div class="row wrap tiny" style="margin-top:8px;gap:6px">${b.documents
    .map((d) => {
      const file = d.file || d;
      const size = d.bytes ? ` <span class="muted">${Math.max(1, Math.round(d.bytes / 1024))} kB</span>` : "";
      return `<span class="pill code">${esc(file)}${size}${
        b.source
          ? ""
          : ` <a href="#" onclick="deleteDoc('${esc(b.id)}','${esc(file)}');return false" title="Delete ${esc(file)}" style="color:var(--red-fg)">×</a>`
      }</span>`;
    })
    .join("")}</div>`;
}

/**
 * Create or edit a base (KB-08). The same form both ways: the id is fixed once it exists, and
 * "read documents from" is the switch between a base that holds its own documents and one that
 * points at a folder already in the workspace.
 */
/** Open a base form fresh: a folder chosen in another base's form must not leak into this one. */
function editBase(which) {
  sourcePick = null;
  editing = which;
  paint();
}

function baseForm(b) {
  const isNew = b === null;
  const base = b ?? { id: "", name: "", kind: "technical", description: "", tags: [], source: null };
  const kinds = ["technical", "functional", "organisational", "market", "other"];
  const folders = store.folders ? store.folders.folders : [];
  // A base whose folder has since been removed still shows it, flagged: silently unlinking it
  // would hide the reason its documents disappeared.
  const known =
    base.source && !folders.some((f) => f.path === base.source) ? [base.source] : [];
  return `<div class="card pad" style="margin-top:12px;margin-bottom:16px">
    <div class="row wrap" style="gap:16px">
      ${isNew
        ? `<label class="tiny">Id<br><input id="kb-id" placeholder="core-platform"></label>`
        : `<label class="tiny">Id<br><input value="${esc(base.id)}" readonly></label>`}
      <label class="tiny">Name<br><input id="kb-name" value="${esc(base.name)}" placeholder="Core platform"></label>
      <label class="tiny">Kind<br><select id="kb-kind">${kinds
        .map((k) => `<option ${k === base.kind ? "selected" : ""}>${k}</option>`)
        .join("")}</select></label>
      <label class="tiny">Authority<br><select id="kb-enforcement">
        <option value="advisory" ${base.enforcement !== "hard" ? "selected" : ""}>advisory — context to use</option>
        <option value="hard" ${base.enforcement === "hard" ? "selected" : ""}>hard rules — may not be broken</option>
      </select></label>
      <label class="tiny">Tags<br><input id="kb-tags" value="${esc((base.tags || []).join(", "))}" placeholder="erp, legacy"></label>
    </div>
    <p class="tiny muted" style="margin:8px 0 0">A base of <b>hard rules</b> — a design system, a
      strict technology directive — is injected first and marked as binding, and an agent that would
      have to break one must stop and ask you instead. That question goes to nobody else: the other
      engine is not consulted and cannot approve it (KB-11). A hard-rule base is never writable by
      an agent. Enforcement is by instruction: nothing reads your design system to catch a breach,
      so what this guarantees is that a breach the agent <em>declares</em> reaches you and only
      you.</p>
    <label class="tiny">Description<br><input id="kb-description" value="${esc(base.description || "")}" style="width:100%"></label>
    <div class="micro" style="margin-top:16px">Where the documents are</div>
    <p class="tiny muted" style="margin:4px 0 8px">Pick any folder in the workspace — a whole tree
      or one branch of it, so a base can be just the part a project needs. Or leave the first
      option and this base holds its own documents, written here. Only the workspace is listed: a
      browser cannot hand over a folder path, and the container's filesystem <em>is</em> the
      workspace (RT-02), so a folder elsewhere on the computer is absent rather than forbidden.</p>
    ${folderTree(base, folders, known)}
    <div class="row" style="gap:8px;margin-top:12px">
      <button class="btn primary" onclick="saveBase(${isNew ? "null" : `'${esc(base.id)}'`})">
        ${isNew ? "Create" : "Save"}</button>
      <button class="btn" onclick="editing=null;paint()">Cancel</button>
    </div>
  </div>`;
}

/**
 * The workspace tree, as a list of radio rows indented by depth (KB-08). A tree of radios rather
 * than a `<select>` because the whole point is to see where a folder sits and how many documents
 * it holds — a flat dropdown of paths shows neither. The chosen path is kept in a hidden input, so
 * `saveBase` reads it exactly like every other field.
 */
function folderTree(base, folders, known) {
  if (sourcePick === null) sourcePick = base.source || "";
  // The tree arrives after the view: say so rather than render an empty picker, which is
  // indistinguishable from a workspace with no folders in it.
  if (store.folders && store.folders.loading) {
    return `<div class="muted tiny" style="padding:8px 0">Reading the workspace…</div>`;
  }
  if (store.folders && store.folders.failed) {
    return `<div class="tiny" style="padding:8px 0">The workspace could not be read, so no folder
      can be picked. This base will hold its own documents.</div>`;
  }
  const chosen = sourcePick;
  const row = (value, label, extra, depth) =>
    `<label class="row" style="gap:8px;padding:5px 8px;padding-left:${8 + depth * 18}px;border-radius:var(--r-sm);cursor:pointer">
      <input type="checkbox" ${value === chosen ? "checked" : ""}
             onchange="pickFolder('${esc(value)}')" style="pointer-events:none">
      <span>${label}</span>${extra}</label>`;

  const missing = known
    .map((f) =>
      row(
        f,
        `<code>${esc(f)}</code>`,
        ` <span class="pill red">not in the workspace any more</span>`,
        0,
      ),
    )
    .join("");

  const rows = folders
    .map((f) => {
      // What the folder is, said plainly: already a base, adoptable in place, or linkable.
      const count = f.documents
        ? ` <span class="tiny muted">${f.documents} document(s)</span>`
        : ` <span class="tiny muted">empty</span>`;
      const mark = f.baseId
        ? ` <span class="pill">base <code>${esc(f.baseId)}</code></span>`
        : f.adoptInPlace && f.documents
          ? ` <span class="pill blue">ready to adopt</span>`
          : "";
      return row(f.path, esc(f.name), count + mark, f.depth);
    })
    .join("");

  return `<input type="hidden" id="kb-source" value="${esc(chosen)}">
    <div class="card" style="max-height:320px;overflow:auto;padding:6px">
      ${row("", `this base's own folder <code>knowledge/${esc(base.id || "<id>")}</code>`, "", 0)}
      ${missing}
      ${rows || `<div class="tiny muted" style="padding:8px">The workspace has no other folders
        yet. Make one next to <code>knowledge/</code> in the workspace and it appears here.</div>`}
    </div>
    ${adoptHint(chosen, folders)}`;
}

/**
 * What pressing Create will do to the folder that is selected (KB-10). Said before it happens,
 * because "adopt" writes a file into a folder that belongs to the user.
 */
function adoptHint(chosen, folders) {
  if (!chosen) {
    return `<p class="tiny muted" style="margin-top:8px">This base will hold its own documents:
      write or upload them here once it exists.</p>`;
  }
  const folder = folders.find((f) => f.path === chosen);
  if (!folder) return "";
  if (folder.baseId) {
    return `<p class="tiny" style="margin-top:8px;color:var(--amber-fg)">
      <code>${esc(chosen)}</code> already is the base <code>${esc(folder.baseId)}</code>. Pick a
      folder inside it to make a base out of just that part.</p>`;
  }
  const where = folder.adoptInPlace
    ? `a <code>knowledge.yaml</code> is written into <code>${esc(chosen)}</code> itself and the
       folder becomes the base — nothing moves`
    : `a base is created in <code>knowledge/&lt;id&gt;</code> that reads from
       <code>${esc(chosen)}</code>; that folder is not touched`;
  return `<p class="tiny" style="margin-top:8px;color:var(--fg-2)">On Create: ${where}. Its
    <b>${folder.documents} document(s)</b>, subfolders included, become readable to any project
    this base is attached to. An existing index is kept as it is.</p>`;
}

/**
 * One folder at a time: this is a choice, not a set. Kept panel-local rather than read back off
 * the DOM, because `paint()` rebuilds the tree and would otherwise re-render the old value.
 */
function pickFolder(value) {
  sourcePick = sourcePick === value ? "" : value;
  paint();
}

/** Add a document: type it, or pick a text file from the computer and it is read in place. */
function docForm(b) {
  return `<div style="margin-top:12px">
    <div class="row wrap" style="gap:16px">
      <label class="tiny">File name<br><input id="kb-doc-file" placeholder="data-model.md"></label>
      <label class="tiny">…or upload a file<br>
        <input id="kb-doc-upload" type="file" accept=".md,.markdown,.txt,text/plain,text/markdown"
               onchange="loadUpload('${esc(b.id)}')"></label>
    </div>
    <label class="tiny">Content<br><textarea id="kb-doc-body" rows="10" style="width:100%"></textarea></label>
    <p class="tiny muted">Text only — <code>.md</code>, <code>.markdown</code>, <code>.txt</code>.
      A document that cannot be injected is a document the agent is told exists and cannot read.</p>
    <div class="row" style="gap:8px;margin-top:12px">
      <button class="btn primary" onclick="saveDoc('${esc(b.id)}')">Save the document</button>
      <button class="btn" onclick="editing=null;paint()">Cancel</button>
    </div></div>`;
}

/**
 * Read a picked file into the form rather than posting multipart: a knowledge document is text,
 * the write route already takes text, and this way what is uploaded is visible before it is saved.
 */
async function loadUpload() {
  const input = $("kb-doc-upload");
  const file = input && input.files ? input.files[0] : null;
  if (!file) return;
  if (!/\.(md|markdown|txt)$/i.test(file.name)) {
    store.error = `${file.name} is not a text document (.md, .markdown, .txt)`;
    return paint();
  }
  try {
    $("kb-doc-body").value = await file.text();
    if (!field("kb-doc-file")) $("kb-doc-file").value = file.name;
    store.error = "";
  } catch (err) {
    store.error = `could not read ${file.name}: ${err.message}`;
    paint();
  }
}

async function saveBase(id) {
  const folder = field("kb-source") || null;
  const patch = {
    name: field("kb-name"),
    kind: field("kb-kind"),
    enforcement: field("kb-enforcement") || "advisory",
    description: field("kb-description"),
    tags: csv("kb-tags"),
  };

  if (id === null) {
    // Creating against a folder is an adoption: the server writes the manifest into it, or a
    // base that links to it, and either way only what is missing (KB-10).
    if (folder) {
      const suggested = folder.split("/").pop();
      return act("POST", "/api/knowledge/adopt", {
        folder,
        id: field("kb-id") || suggested,
        ...patch,
        name: patch.name || field("kb-id") || suggested,
      });
    }
    const newId = field("kb-id");
    if (!newId) { store.error = "an id is required"; return paint(); }
    return act("POST", "/api/knowledge", {
      id: newId,
      ...patch,
      name: patch.name || newId,
      source: null,
    });
  }

  await act("PUT", `/api/knowledge/${encodeURIComponent(id)}`, { ...patch, source: folder });
}

async function saveDoc(baseId) {
  const file = field("kb-doc-file");
  if (!file) { store.error = "a file name is required"; return paint(); }
  await act("PUT", `/api/knowledge/${encodeURIComponent(baseId)}/doc`, {
    file,
    content: $("kb-doc-body").value,
  });
}

async function deleteDoc(baseId, file) {
  if (!confirmed(`the document ${file} from ${baseId}`)) return;
  await act("DELETE", `/api/knowledge/${encodeURIComponent(baseId)}/doc`, { file });
}

async function deleteBase(id) {
  if (!confirmed(`the knowledge base ${id}`)) return;
  await act("DELETE", `/api/knowledge/${encodeURIComponent(id)}`);
}

/* ---------- vault (VT-01..03) ---------- */

function viewVault() {
  const v = store.vault;
  if (!v) return `<div class="empty">Loading…</div>`;
  return `<h1>Vault <em>${v.entries.length}</em></h1>
    <p class="sub">Values are write-only. Nothing here, and no route behind it, ever returns
      one: the panel can set a token and can tell you whether one is set, and that is all
      (VT-03).</p>
    <div class="row" style="margin-bottom:16px">
      <button class="btn primary" onclick="editing='new-entry';paint()">New entry</button>
    </div>
    ${editing === "new-entry" ? vaultForm({ id: "", label: "", auth: "none", fields: [] }, true) : ""}
    ${v.entries
      .map(
        (e) => `<div class="card pad" style="margin-bottom:16px">
      <div class="row" style="justify-content:space-between">
        <div><b>${esc(e.label)}</b> <code class="tiny">${esc(e.id)}</code>
          ${e.test_only ? `<span class="pill green"><span class="sdot"></span>test only</span>` : `<span class="pill red"><span class="sdot"></span>not test-only</span>`}
          <div class="tiny muted">${esc(e.base_url || "")} · ${esc(e.auth)}</div>
          ${e.notes ? `<div class="tiny muted">${esc(e.notes)}</div>` : ""}
          <div class="tiny">${e.fields
            .map((f) => `<code>${esc(f.name)}</code> ${f.present ? "set" : "<b>empty</b>"}`)
            .join(" · ") || "<span class='muted'>no fields</span>"}</div></div>
        <div class="row" style="gap:6px">
          <button class="btn sm" onclick="editing='${esc(e.id)}';paint()">Edit</button>
          <button class="btn sm danger" onclick="deleteEntry('${esc(e.id)}')">Delete</button>
        </div>
      </div>
      ${editing === e.id ? vaultForm(e, false) : ""}
    </div>`,
      )
      .join("")}`;
}

function vaultForm(entry, isNew) {
  const auths = ["none", "basic", "bearer", "api_key", "oauth2_client_credentials"];
  return `<div class="card pad" style="margin-bottom:16px">
    <div class="row wrap" style="gap:16px">
      ${isNew ? `<label class="tiny">Id<br><input id="vt-id" placeholder="sandbox-api"></label>` : ""}
      <label class="tiny">Label<br><input id="vt-label" value="${esc(entry.label || "")}"></label>
      <label class="tiny">Base URL<br><input id="vt-url" value="${esc(entry.base_url || "")}"></label>
      <label class="tiny">Auth<br><select id="vt-auth">${auths
        .map((a) => `<option ${a === entry.auth ? "selected" : ""}>${a}</option>`)
        .join("")}</select></label>
      <label class="tiny">Scope (project ids, or *)<br>
        <input id="vt-scope" value="${esc((entry.scope || ["*"]).join(", "))}"></label>
      <label class="tiny">Test only<br>
        <input type="checkbox" id="vt-test" ${entry.test_only ? "checked" : ""}></label>
    </div>
    <label class="tiny">Notes<br><input id="vt-notes" style="width:100%" value="${esc(entry.notes || "")}"></label>
    <label class="tiny">Fields (one per line, <code>name=value</code>; leave a value empty to keep what is stored)<br>
      <textarea id="vt-fields" rows="5" style="width:100%;font-family:var(--mono)">${esc(
        (entry.fields || []).map((f) => `${f.name}=`).join("\n"),
      )}</textarea></label>
    <div class="row" style="gap:8px;margin-top:12px">
      <button class="btn primary" onclick="saveEntry(${isNew ? "null" : `'${esc(entry.id)}'`})">Save</button>
      <button class="btn" onclick="editing=null;paint()">Cancel</button>
    </div>
  </div>`;
}

async function saveEntry(existingId) {
  const id = existingId || field("vt-id");
  if (!id) { store.error = "an id is required"; return paint(); }
  const fields = {};
  for (const line of $("vt-fields").value.split("\n")) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    const at = trimmed.indexOf("=");
    const name = (at === -1 ? trimmed : trimmed.slice(0, at)).trim();
    const value = at === -1 ? "" : trimmed.slice(at + 1);
    // An empty value means "leave the stored one alone", which is what makes the form
    // usable at all: it never sees what is already there.
    if (name && value) fields[name] = value;
  }
  await act("PUT", `/api/vault/${encodeURIComponent(id)}`, {
    label: field("vt-label") || id,
    base_url: field("vt-url"),
    auth: field("vt-auth"),
    test_only: checked("vt-test"),
    scope: csv("vt-scope").length ? csv("vt-scope") : ["*"],
    notes: field("vt-notes"),
    fields,
  });
}

async function deleteEntry(id) {
  if (!confirmed(`the vault entry ${id}`)) return;
  await act("DELETE", `/api/vault/${encodeURIComponent(id)}`);
}

function viewHealth() {
  const h = store.health;
  if (!h) return `<div class="empty">Loading…</div>`;
  return `<h1>Health</h1>
    <p class="sub">What the container, the database and the engines say about themselves.</p>
    <div class="row wrap" style="margin-bottom:24px">
      ${statusPill(h.status === "ok" ? "ok" : "verify_failed")}
      <span class="pill">v${esc(h.version)}</span>
      <span class="pill">up ${esc(duration(h.orchestrator.uptimeSec))}</span>
      <span class="pill">network: ${esc(h.network)}</span>
    </div>
    <div class="card pad"><dl class="kv">
      <dt>Database</dt><dd><code>${esc(h.database.path)}</code>
        ${h.database.ok ? `<span class="pill green"><span class="sdot"></span>ok</span>`
                        : `<span class="pill red"><span class="sdot"></span>${esc(h.database.error || "error")}</span>`}</dd>
      <dt>Started</dt><dd>${esc(h.orchestrator.startedAt)}</dd>
    </dl></div>
    <h2>Engines</h2>
    <div class="card"><table><thead><tr><th>Engine</th><th>Adapter</th><th>Detected</th><th>Auth</th></tr></thead>
      <tbody>${h.engines.map((e) => `<tr>
        <td><b>${esc(e.engine)}</b></td><td><code>${esc(e.adapter)}</code></td>
        <td>${e.detected ? "yes" : "no"}</td>
        <td>${e.auth ? `<span class="pill green"><span class="sdot"></span>${esc(e.authSource || "yes")}</span>`
                     : `<span class="pill red"><span class="sdot"></span>not connected</span>`}</td>

/* ====================== router and data ====================== */
function parseRoute() {
  const hash = location.hash.replace(/^#/, "") || "/";
  const parts = hash.split("/").filter(Boolean);
  if (parts[0] === "p" && parts[1]) {
    return { name: "/p", id: decodeURIComponent(parts[1]), tab: parts[2] ?? null };
  }
  return { name: `/${parts[0] ?? ""}`, id: null, tab: null };
}

const RENDER = {
  "/": viewOverview,
  "/projects": viewProjects,
  "/p": () =>
    route.tab === "history"
      ? viewHistory()
      : route.tab === "knowledge"
        ? viewProjectKnowledge()
        : route.tab === "docs"
          ? viewProjectDocs()
          : route.tab === "context"
            ? viewProjectContext()
            : route.tab === "access"
              ? viewProjectAccess()
              : viewProject(),
  "/agents": viewAgents,
  "/templates": viewTemplates,
  "/knowledge": viewKnowledge,
  "/vault": viewVault,
  "/health": viewHealth,
  // The wizard is its own page (it has to work before the panel has anything to show). The
  // hash route of §12.3 exists so a link to #/setup lands there rather than nowhere.
  "/setup": () => {
    location.replace("/setup.html");
    return `<div class="empty">Opening setup…</div>`;
  },
};

function paint() {
  const render = RENDER[route.name] ?? (() => `<div class="empty">Not found: ${esc(location.hash)}</div>`);
  // The timeline is the one thing the user scrolls while it is being repainted every second.
  const scrolled = $("timeline") ? $("timeline").scrollTop : null;
  // A refusal and a confirmation are both messages the user asked for by pressing a button, so
  // both sit above the view rather than one being a banner and the other nothing at all.
  const banner = store.error
    ? `<div class="note bad" style="margin-bottom:24px">${esc(store.error)}</div>`
    : store.notice
      ? `<div class="note good" style="margin-bottom:24px">${esc(store.notice)}</div>`
      : "";
  $("view").innerHTML = banner + render();
  if (scrolled !== null && $("timeline")) $("timeline").scrollTop = scrolled;

  const active = route.name === "/p" ? "/projects" : route.name;
  document.querySelectorAll("aside a[data-r]").forEach((a) => {
    a.classList.toggle("on", a.getAttribute("data-r") === active);
  });
  const o = store.overview;
  $("nav-projects").innerHTML = o && o.counts.openDoubts
    ? `<span class="pill amber">${o.counts.openDoubts}</span>` : "";
  $("nav-health").innerHTML = o && o.engines.some((e) => !e.auth || !e.detected)
    ? `<span class="pill red">1</span>` : "";
}

/** Load whatever the current route needs, then paint. Failures are shown, never swallowed. */
async function load() {
  try {
    if (route.name === "/p" && route.id) {
      const id = encodeURIComponent(route.id);
      store.project = await api(`/api/projects/${id}`);
      store.phases = await api(`/api/projects/${id}/phases`);
      // AP-09: the launch form offers a model for this run, so the project view needs the same
      // catalog the agent editor uses. Cached: neither list changes while the panel is open.
      if (!store.models) store.models = await api("/api/agents/models").catch(() => null);
      if (!store.agents) store.agents = await api("/api/agents").catch(() => null);
      if (route.tab === "history") {
        store.history = await api(`/api/projects/${id}/history?limit=50`);
      }
      if (route.tab === "knowledge") store.knowledge = await api("/api/knowledge");
      // The document list (PM-10). Re-read on every load so a deliverable written by the run
      // in flight shows up without a manual reload.
      if (route.tab === "docs") store.docs = await api(`/api/projects/${id}/docs`);
      // The Access tab picks a folder from the workspace rather than asking someone to type a
      // path from memory (PE-09). The walk is slow enough to be worth loading in the background.
      if (route.tab === "access" && !store.folders) {
        store.folders = { folders: [], loading: true };
        api("/api/knowledge/folders")
          .then((data) => {
            store.folders = data;
            paint();
          })
          .catch(() => {
            store.folders = { folders: [], failed: true };
            paint();
          });
      }
      // Live run if there is one, otherwise the last one that ended: its events were already
      // stored and served, and until now nothing in the panel could reach them.
      watchRun(
        store.project.run
          ? store.project.run.id
          : store.project.lastRun
            ? store.project.lastRun.id
            : null,
      );
    } else if (route.name === "/agents") {
      store.agents = await api("/api/agents");
      // AP-08: the editor offers models from this catalog and never a free-text box, so it is
      // fetched with the profiles rather than lazily inside the editor.
      if (!store.models) store.models = await api("/api/agents/models");
    } else if (route.name === "/templates") {
      store.templates = await api("/api/templates");
      // The phase editor picks the agent from a select, so it needs the profiles (TP-04).
      store.agents = await api("/api/agents").catch(() => null);
    } else if (route.name === "/knowledge") {
      store.knowledge = await api("/api/knowledge");
      // The folder tree (KB-08) is only needed once the create form is open, and walking the
      // workspace over a bind mount is the slowest read the panel makes. Awaiting it here meant
      // the whole view waited on it and looked like it had failed to open. It is fetched in the
      // background and the tree repaints when it lands.
      if (!store.folders) {
        store.folders = { folders: [], loading: true };
        void api("/api/knowledge/folders")
          .then((data) => {
            store.folders = data;
          })
          .catch(() => {
            store.folders = { folders: [], failed: true };
          })
          .finally(paint);
      }
    } else if (route.name === "/vault") {
      store.vault = await api("/api/vault");
    } else if (route.name === "/health") {
      store.health = await api("/health");
    } else {
      store.overview = await api(`/api/overview${showArchived ? "?archived=true" : ""}`);
      // The project list needs the templates to offer them in the create form (WP-10).
      if (route.name === "/projects" && !store.templates) {
        store.templates = await api("/api/templates").catch(() => null);
      }
    }
    // Deliberately not clearing `store.error` here. `act()` sets it and then calls this to
    // re-read, so clearing it on a successful read threw away the refusal the user needed to
    // see — a create that the server had rejected looked exactly like a create that did nothing.
    // Stale messages are cleared on navigation instead, where they belong.
  } catch (err) {
    store.error = err.message;
  }
  paint();
}

/**
 * Tail one run's timeline. The named SSE event carries the run id, so the listener is swapped
 * whenever the open run changes; the backlog comes from the REST endpoint so a run already in
 * flight is not shown starting from the middle.
 */
async function watchRun(runId) {
  if (runListener) {
    if (stream) stream.removeEventListener(runListener.name, runListener.fn);
    runListener = null;
  }
  timeline = [];
  narrative = [];
  if (!runId) return;
  try {
    const seen = await api(`/api/runs/${encodeURIComponent(runId)}/events?limit=200`);
    timeline = seen.events;
  } catch { /* the run may have just ended; the stream will fill in */ }
  await refreshNarrative(runId);
  const name = `run:${runId}`;
  const fn = (message) => {
    timeline.push(JSON.parse(message.data));
    // The narration is the server's, so it is re-read rather than reimplemented here — at most
    // once a second, because a busy run emits several events per second.
    if (Date.now() - lastNarrated > 1000) void refreshNarrative(runId);
    const node = $("timeline");
    if (node) {
      node.innerHTML = timelineRows();
      node.scrollTop = node.scrollHeight;
    }
  };
  runListener = { name, fn };
  if (stream) stream.addEventListener(name, fn);
  const node = $("timeline");
  if (node) node.innerHTML = timelineRows();
}

/* ---------- SSE (WP-03) ---------- */
function setConnection(state, label) {
  const node = $("conn");
  node.className = `conn ${state}`;
  node.innerHTML = `<span class="sdot"></span> ${esc(label)}`;
}

let reconnectDelay = 1000;
function connect() {
  stream = new EventSource("/api/stream");

  stream.addEventListener("open", () => {
    reconnectDelay = 1000;
    setConnection("live", "live");
  });

  stream.addEventListener("overview", (message) => {
    // The overview backs two views directly and the sidebar counters everywhere else.
    store.overview = JSON.parse(message.data);
    paint();
  });

  stream.addEventListener("doubt", () => {
    if (route.name === "/p") void load();
  });

  stream.addEventListener("system", () => {
    if (route.name === "/p") void load();
  });

  if (runListener) stream.addEventListener(runListener.name, runListener.fn);

  stream.onerror = () => {
    setConnection("down", "reconnecting…");
    stream.close();
    // The browser reconnects EventSource on its own, but only for a live socket; a server
    // restart needs a fresh one, with backoff so a container that is down is not hammered.
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 15000);
  };
}

/** The run card's clocks tick locally between events, so the panel never looks frozen. */
setInterval(() => {
  const run = route.name === "/p" && store.project ? store.project.run : null;
  if (run) {
    run.elapsedS += 1;
    run.inactivityS += 1;
    if (!document.hidden) paint();
  }
}, 1000);

window.addEventListener("hashchange", () => {
  route = parseRoute();
  // Navigating away is what clears a message: it belonged to the view that produced it.
  store.error = "";
  store.notice = "";
  editing = null;
  sourcePick = null;
  void load();
});

route = parseRoute();
void load();
connect();
</script>
</body>
