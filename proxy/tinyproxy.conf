# LightsOut egress allowlist (RT-05).
# Only the hosts listed below can be reached; everything else is denied.
# Add your git remote hosts (github.com, gitlab.com, ...) to the Filter file.

User nobody
Group nogroup
Port 8888
Timeout 600
LogLevel Warning

# Only containers on the internal network may use the proxy.
Allow 0.0.0.0/0

# CONNECT is required for HTTPS; restrict it to 443.
ConnectPort 443

# Allowlist: deny everything not matching the filter file.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended On
FilterURLs Off
FilterCaseSensitive Off

DisableViaHeader Yes
